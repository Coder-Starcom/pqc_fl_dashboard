<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PQC Federated Dashboard</title>
    <link rel="stylesheet" href="style.css" />
    <script src="config.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
  </head>
  <body>
    <h1 class="title">PQC Federated Dashboard</h1>
    <p class="subtitle">Live Metrics Overview</p>

    <section class="charts-section">
      <div class="charts-grid">
        <div class="card chart-card">
          <h3>Federated Convergence</h3>
          <canvas id="chartConvergence"></canvas>
        </div>
        <div class="card chart-card">
          <h3>Noise Budget Decay</h3>
          <canvas id="chartNoise"></canvas>
        </div>
        <div class="card chart-card">
          <h3>Security Tax Latency</h3>
          <canvas id="chartSecurityTax"></canvas>
        </div>
        <div class="card chart-card">
          <h3>Bandwidth Optimization</h3>
          <canvas id="chartBandwidth"></canvas>
        </div>
      </div>
    </section>

    <script src="api.js"></script>
    <script src="app.js"></script>
  </body>
</html>
