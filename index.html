<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>PQC Federated Control Centre</title>

    <link rel="stylesheet" href="style.css" />

    <script src="config.js"></script>
  </head>

  <body>
    <h1 class="title">PQC Federated Monitor</h1>

    <div class="grid">
      <!-- Coordinator Card -->

      <div class="card">
        <h2>Coordinator Node</h2>

        <div id="status" class="status-booting">BOOTING</div>

        <div id="round" class="value">0</div>

        <div class="pqc-status">Post-Quantum Layer: VERIFIED (RLWE-AHE)</div>
      </div>

      <!-- Blindness Verification -->

      <div class="card">
        <h2>Blindness Verification</h2>

        <div id="blindnessStatus" class="blindness-warn">
          Aggregator State: INITIALIZING
        </div>

        <div class="metric">
          Entropy: <span id="blindnessEntropy">0</span> bits
        </div>

        <div class="metric">
          Variance: <span id="blindnessVariance">0</span>
        </div>
      </div>
    </div>

    <!-- Logs -->

      <div class="log-container" id="logs">
        <div class="log-entry">
          System booting... Fetching global model from Render...
        </div>
      </div>

    <script src="app.js"></script>
  </body>
</html>
